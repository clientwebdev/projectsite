<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Bootstrap Layout</title>

    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
        rel="stylesheet">

    <!-- Font Awesome -->
    <link 
        rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fa-solid fa-layer-group me-2"></i>My Website
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <header class="bg-light py-5">
        <div class="container text-center">
            <h1 class="display-4">Welcome</h1>
            <p class="lead">A simple Bootstrap layout with Font Awesome icons.</p>
            <a href="#" class="btn btn-primary">
                <i class="fa-solid fa-circle-info me-2"></i>Learn More
            </a>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <section class="py-5">
        <div class="container">
            <div class="row g-4">

                <div class="col-md-4">
                    <div class="p-4 border rounded text-center">
                        <i class="fa-solid fa-bolt fa-2x mb-3 text-warning"></i>
                        <h4>Fast</h4>
                        <p>Bootstrap helps you build responsive layouts quickly.</p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="p-4 border rounded text-center">
                        <i class="fa-solid fa-mobile-screen-button fa-2x mb-3 text-primary"></i>
                        <h4>Responsive</h4>
                        <p>Everything scales beautifully on any device.</p>
