<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Team Layout</title>

    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
        rel="stylesheet">

    <!-- Font Awesome -->
    <link 
        rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#" onclick="showHome()">
                <i class="fa-solid fa-layer-group me-2"></i>My Website
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="showHome()">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="showTeam()">Team</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- HOME SECTION -->
    <div id="homeSection">
        <header class="bg-light py-5">
            <div class="container text-center">
                <h1 class="display-4">Welcome</h1>
                <p class="lead">A simple Bootstrap layout with a dynamic Team section.</p>
                <a href="#" class="btn btn-primary" onclick="showTeam()">
                    <i class="fa-solid fa-users me-2"></i>Meet the Team
                </a>
            </div>
        </header>
    </div>

    <!-- TEAM SECTION -->
    <div id="teamSection" class="py-5" style="display:none;">
        <div class="container">
            <h2 class="text-center mb-4">
                <i class="fa-solid fa-people-group me-2"></i>Our Team
            </h2>

            <div class="row g-4">

                <!-- Team Leader -->
                <div class="col-md-3">
                    <div class="card text-center p-3">
                        <img src="https://via.placeholder.com/150" class="rounded-circle mx-auto mb-3" alt="Leader">
                        <h5 class="fw-bold">Alex Johnson</h5>
                        <p class="text-primary fw-semibold">Team Leader</p>
                    </div>
                </div>

                <!-- Member 2 -->
                <div class="col-md-3">
                    <div class="card text-center p-3">
                        <img src="https://via.placeholder.com/150" class="rounded-circle mx-auto mb-3" alt="Member">
                        <h5 class="fw-bold">Maria Lopez</h5>
                        <p>Developer</p>
                    </div>
                </div>

                <!-- Member 3 -->
                <div class="col-md-3">
                    <div class="card text-center p-3">
                        <img src="https://via.placeholder.com/150" class="rounded-circle mx-auto mb-3" alt="Member">
                        <h5 class="fw-bold">James Carter</h5>
                        <p>Designer</p>
                    </div>
                </div>

                <!-- Member 4 -->
                <div class="col-md-3">
                    <div class="card text-center p-3">
                        <img src="https://via.placeholder.com/150" class="rounded-circle mx-auto mb-3" alt="Member">
                        <h5 class="fw-bold">Sophie Miller</h5>
                        <p>Project Coordinator</p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-dark text-white py-3 mt-5">
        <div class="container text-center">
            <p class="mb-0">
                <i class="fa-regular fa-copyright me-1"></i>
                2026 My Website
            </p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- SHOW/HIDE LOGIC -->
    <script>
        function showHome() {
            document.getElementById("homeSection").style.display = "block";
            document.getElementById("teamSection").style.display = "none";
        }

        function showTeam() {
            document.getElementById("homeSection").style.display = "none";
            document.getElementById("teamSection").style.display = "block";
        }
    </script>

</body>
</html>
